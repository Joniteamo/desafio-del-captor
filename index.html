<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Desafio-Captor</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#0f0f1a;
    overflow:hidden;
    font-family:'Orbitron',sans-serif;
}
canvas{
    display:block;
    margin:auto;
    background:#0f0f1a;
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 1100;
canvas.height = 550;

const FLOOR_Y = canvas.height - 90;

const COLORS = {
    bg:"#0f0f1a",
    player:"#00e0ff",
    obstacle:"#ff2e63",
    floor:"#1f2235"
};

let speed = 8;

let player = {
    x:200,
    y:FLOOR_Y-55,
    width:55,
    height:55,
    velocityY:0,
    gravity:0.9,
    jumpForce:-18,
    onGround:true,
    rotation:0
};

let obstacles = [];
let spawnTimer = 0;

let gameOver = false;
let deathTimer = 0;

document.addEventListener("keydown",jump);
document.addEventListener("mousedown",jump);

function jump(){
    if(player.onGround && !gameOver){
        player.velocityY = player.jumpForce;
        player.onGround = false;
    }
}

function spawnObstacle(){

    let heights = [60, 80, 120];
    let height = heights[Math.floor(Math.random()*heights.length)];

    let obstacle = {
        x: canvas.width + 50,
        y: FLOOR_Y - height,
        width: 60,
        height: height
    };

    obstacles.push(obstacle);

    // 30% probabilidad doble
    if(Math.random() < 0.3){
        obstacles.push({
            x: obstacle.x + 90,
            y: FLOOR_Y - 60,
            width: 60,
            height: 60
        });
    }
}

function update(delta){

    if(gameOver){
        deathTimer += delta;
        if(deathTimer > 25){
            resetGame();
        }
        return;
    }

    // física
    player.velocityY += player.gravity * delta;
    player.y += player.velocityY * delta;

    if(player.y >= FLOOR_Y - player.height){
        player.y = FLOOR_Y - player.height;
        player.velocityY = 0;
        player.onGround = true;
    }

    if(!player.onGround){
        player.rotation += 0.15 * delta;
    } else {
        player.rotation = 0;
    }

    // spawn dinámico estilo GD
    spawnTimer += delta;

    if(spawnTimer > 65 + Math.random()*50){
        spawnObstacle();
        spawnTimer = 0;
    }

    // mover obstáculos
    for(let obs of obstacles){
        obs.x -= speed * delta;

        // colisión
        if(
            player.x < obs.x + obs.width &&
            player.x + player.width > obs.x &&
            player.y < obs.y + obs.height &&
            player.y + player.height > obs.y
        ){
            gameOver = true;
        }
    }

    // eliminar los que salen
    obstacles = obstacles.filter(o => o.x + o.width > -50);
}

function drawBackground(){
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    for(let i=0;i<canvas.width;i+=60){
        ctx.beginPath();
        ctx.moveTo(i,0);
        ctx.lineTo(i,canvas.height);
        ctx.stroke();
    }

    ctx.fillStyle = COLORS.floor;
    ctx.fillRect(0,FLOOR_Y,canvas.width,100);
}

function drawPlayer(){
    ctx.save();
    ctx.translate(player.x + player.width/2, player.y + player.height/2);
    ctx.rotate(player.rotation);
    ctx.fillStyle = COLORS.player;
    ctx.fillRect(-player.width/2,-player.height/2,player.width,player.height);
    ctx.restore();
}

function drawObstacles(){
    ctx.fillStyle = COLORS.obstacle;

    for(let obs of obstacles){
        ctx.beginPath();
        ctx.moveTo(obs.x, obs.y + obs.height);
        ctx.lineTo(obs.x + obs.width/2, obs.y);
        ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
        ctx.closePath();
        ctx.fill();
    }
}

function drawUI(){
    ctx.fillStyle="white";
    ctx.font="26px Orbitron";
    ctx.fillText("DESAFIO CAPTOR",30,40);
}

function draw(){
    drawBackground();
    drawObstacles();
    drawPlayer();
    drawUI();
}

function resetGame(){
    obstacles=[];
    player.y = FLOOR_Y - player.height;
    player.velocityY = 0;
    player.rotation = 0;
    gameOver=false;
    deathTimer=0;
}

let lastTime=0;

function loop(timestamp){
    let delta=(timestamp-lastTime)/16.67;
    lastTime=timestamp;

    update(delta);
    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
