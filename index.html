<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Desafio-Captor</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
body{
    margin:0;
    background:#0f0f1a;
    overflow:hidden;
}
canvas{
    display:block;
    margin:auto;
    background:#0f0f1a;
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 1200;
canvas.height = 600;

const FLOOR_Y = canvas.height - 100;
const SPEED = 8;
const GRAVITY = 1.2;
const JUMP_FORCE = -22;

let player = {
    x: 250,
    y: FLOOR_Y - 70,
    width: 70,
    height: 70,
    velocityY: 0,
    onGround: true,
    rotation: 0
};

// NIVEL DISEÑADO (posiciones fijas)
let level = [
    {x: 900},
    {x: 1300},
    {x: 1700},
    {x: 2000},
    {x: 2400},        // doble spike
    {x: 2500},
    {x: 3000},
    {x: 3600},
    {x: 4200}
];

let obstacles = [];

function buildLevel(){
    for(let obj of level){
        obstacles.push({
            x: obj.x,
            y: FLOOR_Y - 70,
            width: 70,
            height: 70
        });
    }
}

buildLevel();

let cameraX = 0;
let gameOver = false;
let deathTimer = 0;

document.addEventListener("keydown", jump);
document.addEventListener("mousedown", jump);

function jump(){
    if(player.onGround && !gameOver){
        player.velocityY = JUMP_FORCE;
        player.onGround = false;
    }
}

function update(delta){

    if(gameOver){
        deathTimer += delta;
        if(deathTimer > 30){
            resetGame();
        }
        return;
    }

    cameraX += SPEED * delta;

    // Física
    player.velocityY += GRAVITY * delta;
    player.y += player.velocityY * delta;

    if(player.y >= FLOOR_Y - player.height){
        player.y = FLOOR_Y - player.height;
        player.velocityY = 0;
        player.onGround = true;
    }

    if(!player.onGround){
        player.rotation += 0.18 * delta;
    } else {
        player.rotation = 0;
    }

    // Colisión
    for(let obs of obstacles){
        let screenX = obs.x - cameraX;

        if(
            player.x < screenX + obs.width - 10 &&
            player.x + player.width - 10 > screenX &&
            player.y < obs.y + obs.height &&
            player.y + player.height > obs.y
        ){
            gameOver = true;
        }
    }
}

function drawBackground(){
    ctx.fillStyle = "#0f0f1a";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#1f2235";
    ctx.fillRect(0,FLOOR_Y,canvas.width,120);
}

function drawPlayer(){
    ctx.save();
    ctx.translate(player.x + player.width/2, player.y + player.height/2);
    ctx.rotate(player.rotation);
    ctx.fillStyle = "#00e0ff";
    ctx.fillRect(-player.width/2,-player.height/2,player.width,player.height);
    ctx.restore();
}

function drawObstacles(){
    ctx.fillStyle = "#ff2e63";

    for(let obs of obstacles){
        let screenX = obs.x - cameraX;

        ctx.beginPath();
        ctx.moveTo(screenX, obs.y + obs.height);
        ctx.lineTo(screenX + obs.width/2, obs.y);
        ctx.lineTo(screenX + obs.width, obs.y + obs.height);
        ctx.closePath();
        ctx.fill();
    }
}

function draw(){
    drawBackground();
    drawObstacles();
    drawPlayer();
}

function resetGame(){
    cameraX = 0;
    player.y = FLOOR_Y - player.height;
    player.velocityY = 0;
    player.rotation = 0;
    gameOver = false;
    deathTimer = 0;
}

let lastTime = 0;

function loop(timestamp){
    let delta = (timestamp - lastTime) / 16.67;
    lastTime = timestamp;

    update(delta);
    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
