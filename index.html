<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Desafio-Captor</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
body{
    margin:0;
    background:#0f0f1a;
    overflow:hidden;
    font-family:'Orbitron',sans-serif;
}
canvas{
    display:block;
    margin:auto;
    background:#0f0f1a;
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 1200;
canvas.height = 600;

const FLOOR_Y = canvas.height - 100;

// ============================
// CONFIGURACIÓN BALANCEADA
// ============================

const speed = 11;           // velocidad horizontal
const gravity = 1.3;        // gravedad firme
const jumpForce = -24;      // salto alto real
const spikeWidth = 70;
const spikeHeight = 70;

// ============================

let player = {
    x: 250,
    y: FLOOR_Y - 70,
    width: 70,
    height: 70,
    velocityY: 0,
    onGround: true,
    rotation: 0
};

let obstacles = [];
let distanceCounter = 0;
let nextSpawnDistance = 450;

let gameOver = false;
let deathTimer = 0;

// ============================
// INPUT
// ============================

document.addEventListener("keydown", jump);
document.addEventListener("mousedown", jump);

function jump(){
    if(player.onGround && !gameOver){
        player.velocityY = jumpForce;
        player.onGround = false;
    }
}

// ============================
// SPAWN INTELIGENTE
// ============================

function spawnSpike(){

    obstacles.push({
        x: canvas.width + 50,
        y: FLOOR_Y - spikeHeight,
        width: spikeWidth,
        height: spikeHeight
    });

    // 30% doble spike con separación correcta
    if(Math.random() < 0.30){
        obstacles.push({
            x: canvas.width + 50 + 140,
            y: FLOOR_Y - spikeHeight,
            width: spikeWidth,
            height: spikeHeight
        });
    }

    // nueva distancia calculada en espacio real
    nextSpawnDistance = 420 + Math.random() * 250;
}

// ============================
// UPDATE
// ============================

function update(delta){

    if(gameOver){
        deathTimer += delta;
        if(deathTimer > 30){
            resetGame();
        }
        return;
    }

    // Física vertical
    player.velocityY += gravity * delta;
    player.y += player.velocityY * delta;

    if(player.y >= FLOOR_Y - player.height){
        player.y = FLOOR_Y - player.height;
        player.velocityY = 0;
        player.onGround = true;
    }

    if(!player.onGround){
        player.rotation += 0.18 * delta;
    } else {
        player.rotation = 0;
    }

    // Movimiento obstáculos
    for(let obs of obstacles){
        obs.x -= speed * delta;

        // Colisión precisa
        if(
            player.x < obs.x + obs.width - 8 &&
            player.x + player.width - 8 > obs.x &&
            player.y < obs.y + obs.height &&
            player.y + player.height > obs.y
        ){
            gameOver = true;
        }
    }

    obstacles = obstacles.filter(o => o.x + o.width > -100);

    // Spawn basado en distancia real recorrida
    distanceCounter += speed * delta;

    if(distanceCounter > nextSpawnDistance){
        spawnSpike();
        distanceCounter = 0;
    }
}

// ============================
// DRAW
// ============================

function drawBackground(){
    ctx.fillStyle = "#0f0f1a";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#1f2235";
    ctx.fillRect(0,FLOOR_Y,canvas.width,120);
}

function drawPlayer(){
    ctx.save();
    ctx.translate(player.x + player.width/2, player.y + player.height/2);
    ctx.rotate(player.rotation);
    ctx.fillStyle = "#00e0ff";
    ctx.fillRect(-player.width/2,-player.height/2,player.width,player.height);
    ctx.restore();
}

function drawSpikes(){
    ctx.fillStyle = "#ff2e63";

    for(let obs of obstacles){
        ctx.beginPath();
        ctx.moveTo(obs.x, obs.y + obs.height);
        ctx.lineTo(obs.x + obs.width/2, obs.y);
        ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
        ctx.closePath();
        ctx.fill();
    }
}

function draw(){
    drawBackground();
    drawSpikes();
    drawPlayer();
}

// ============================
// RESET
// ============================

function resetGame(){
    obstacles = [];
    distanceCounter = 0;
    player.y = FLOOR_Y - player.height;
    player.velocityY = 0;
    player.rotation = 0;
    gameOver = false;
    deathTimer = 0;
}

// ============================
// LOOP FLUIDO
// ============================

let lastTime = 0;

function loop(timestamp){
    let delta = (timestamp - lastTime) / 16.67;
    lastTime = timestamp;

    update(delta);
    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>
</body>
</html>
